[project]
name = "capper"
version = "0.1.0"
description = "Capper: an AI chat agent for the Carton Caps app (proof of concept)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "fastapi==0.163.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "pydantic-ai-harness==0.69.0",
    "pydantic-ai-slim[openai]==2.69.0",
    "pydantic-settings==2.16.3",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capper", "src/content_bundle", "src/ingestion"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.16.2",
    "pip-audit>=2.9",
    "pyright>=1.1.400",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]
evals = [
    "pydantic-evals==2.69.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Markdown (the docs and logs) is prose, kept as written; ruff formats Python only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pyright]
include = ["src", "scripts", "tests", "evals", "alembic"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
