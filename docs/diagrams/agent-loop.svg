etica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">lookups, policy reads,</text><text x="200.0" y="629.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">cards, saved guidance</text><path d="M200,550 L200,573" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#head)"/><path d="M100,605 L70,605 L70,260 L98,260" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#head)"/><text x="46" y="430" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2c3740" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" transform="rotate(-90 46 430)">tool results, next request</text><rect x="1060" y="400" width="200" height="240" rx="10" fill="#e6f0fb" stroke="#3a78c2" stroke-width="1.6"/><text x="1160.0" y="525.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2a33">Client</text><path d="M300,420 L1058,420" fill="none" stroke="#4a5560" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#head)"/><text x="680" y="412" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2c3740" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">text.delta via runner</text><path d="M300,445 L500,445 L500,698" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#head)"/><text x="508" y="520" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2c3740" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">final response</text><text x="508" y="535" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2c3740" strok