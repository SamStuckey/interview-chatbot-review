="1.6" stroke-dasharray="7 5" marker-end="url(#head)"/><text x="988" y="683" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2c3740" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">timeout or failure</text><rect x="440" y="790" width="360" height="65" rx="10" fill="#ffffff" stroke="#3c9255" stroke-width="1.6"/><text x="620.0" y="820.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2a33">Attempt to save</text><text x="620.0" y="837.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">reply, model history, summary, status</text><path d="M500,755 L500,788" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#head)"/><path d="M740,755 L740,788" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#head)"/><path d="M980,755 L980,772 L780,772 L780,788" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#head)"/><rect x="380" y="920" width="200" height="55" rx="10" fill="#ffffff" stroke="#3c9255" stroke-width="1.6"/><text x="480.0" y="952.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2a33">Terminal event</text><rect x="700" y="920" width="200" height="55" rx="10" fill="#ffffff" stroke="#3c9255" stroke-width="1.6"/><text x="800.0" y="945.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2a33">Attempt to mark</text><text x="800.0" y="962.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">turn as error</text><path d="M500,855 L500,918" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#head)"/><text x="492" y="893" text-anchor="end" f