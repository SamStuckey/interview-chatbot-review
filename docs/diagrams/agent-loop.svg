-serif" font-size="15" font-weight="bold" fill="#3c9255">Agent run</text><rect x="80" y="205" width="900" height="140" rx="16" fill="#ffffff" stroke="#3c9255" stroke-width="1.5"/><text x="98" y="333" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3c9255">Before each chat-model request</text><rect x="100" y="225" width="200" height="70" rx="10" fill="#ffffff" stroke="#3c9255" stroke-width="1.6"/><text x="200.0" y="250.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2a33">Step 1</text><text x="200.0" y="267.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">Attempt old</text><text x="200.0" y="282.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">tool-result clearing</text><rect x="320" y="225" width="200" height="70" rx="10" fill="#ffffff" stroke="#3c9255" stroke-width="1.6"/><text x="420.0" y="250.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2a33">Step 2</text><text x="420.0" y="267.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">Assess history</text><text x="420.0" y="282.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5560">compaction</text><rect x="540" y="225" width="200" height="70" rx="10" fill="#ffffff" stroke="#3c9255" stroke-width="1.6"/><text x="640.0" y="250.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2a33">Step 3</text><text x="640.0" y="267.0" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-ser